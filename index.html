<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M-Criminologia | Boas-Vindas</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#06080e">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- Fontes Oficiais do Projeto -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <!-- Estilos Globais -->
  <link rel="stylesheet" href="styles.css">

</head>
<body>

  <div class="bg-glow"></div>

  <!-- NAVEGAÇÃO SUPERIOR -->
  <header class="app-header">
    <div class="logo-container logo-animated">
  <span class="logo-prefix">M-</span>
  <span class="logo-title">CRIMINOLOGIA</span>
</div>
    <div class="criminologo-bar">
      <div class="criminologo-profile">
        <span class="criminologo-label">Status:</span>
        <span class="criminologo-nome">SISTEMA PRONTO</span>
      </div>
    </div>
  </header>

  <!-- CONTEÚDO PRINCIPAL DE BOAS-VINDAS -->
  <main class="welcome-container">
    <div class="welcome-card">
      
      <div class="badge-criminologo">
        🛡️ Nível de Acesso: Técnico
      </div>

      <h1 class="hero-title">BEM-VINDO, CRIMINÓLOGO!</h1>
      
      <p class="hero-subtitle">
        Pronto para testar a sua capacidade analítica, domínio de condutas criminais e interpretação de teorias da criminologia? 
      </p>

      <!-- Identificação Dinâmica -->
      <div class="user-welcome-box">
        <input 
          type="text" 
          id="criminologo-name-input" 
          class="criminologo-input-hero" 
          placeholder="Digite seu nome ou ID de Criminólogo"
          value="Criminólogo"
        >
      </div>

      <!-- BOTÃO QUE LEVA À PÁGINA DE TREINO -->
      <a href="principal.html" id="btn-enter-training" class="btn-primary btn-start-training">
        BORA TREINAR? ➔
      </a>

    </div>
  </main>

  <footer style="font-family: system-ui, sans-serif; font-size: 12px; color: #888; text-align: center; padding: 15px;">
    <strong style="color: #007bff;">Monteiro & Monteiro Lda</strong>
  </footer>
<script src="app.js"></script>
  
</body>
</html>
